[project]
name = "nosql-lab"
version = "0.1.0"
description = "NoSQL work for DS2022"
readme = "README.md"
authors = [
    { name = "Leo Valentino Castellon Gutierrez", email = "kvp6ms@virginia.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pymongo>=4.19.0",
]

[project.scripts]
nosql-lab = "nosql_lab:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
